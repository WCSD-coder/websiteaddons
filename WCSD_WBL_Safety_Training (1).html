    contentHtml: `
      <p>The laws enforced by the U.S. Equal Employment Opportunity Commission (EEOC) give you five basic rights at work. These rights apply whether you're full-time, part-time, seasonal, or temporary, and regardless of your citizenship or work authorization status. Nearly every employer with at least 15 employees, along with most unions and employment agencies, is covered.</p>
      <h3>1. Work Free of Discrimination</h3>
      <p>Your employer cannot make job decisions &mdash; including hiring, firing, promotions, training, wages, or benefits &mdash; because of your race, color, religion, sex (including pregnancy, sexual orientation, and transgender status), national origin, disability, genetic information, or age (if you're 40 or older).</p>
      <h3>2. Work Free of Harassment</h3>
      <p>You have the right to work in an environment free of harassment based on those same characteristics &mdash; race, color, religion, sex, national origin, disability, age 40+, or genetic information.</p>
      <h3>3. Complain Without Punishment</h3>
      <p>You have the right to report discrimination you believe is illegal without your employer retaliating against you. Your employer cannot punish you, treat you differently, or harass you for reporting discrimination or helping someone else report it &mdash; even if the complaint turns out not to involve illegal conduct. This is your right to be protected from retaliation.</p>
      <h3>4. Request Reasonable Workplace Changes</h3>
      <p>You can request reasonable changes to your workplace because of your religious beliefs, a medical condition, or pregnancy, childbirth, or related medical conditions. Your employer doesn't have to grant every request, but should carefully consider each one and whether it would be possible.</p>
      <h3>5. Keep Your Medical Information Private</h3>
      <p>The law strictly limits what an employer can ask you about your health. You have the right to keep any genetic or medical information you share with your employer private. In general, your employer should not discuss it with others &mdash; there are only very limited exceptions.</p>
    `,

      </div>
    `,

  {
    id: "harassment",
    name: "Harassment: Signs, Definition & Reporting",
    subtitle: "How to recognize illegal harassment and what to do about it",
    attribution: "Adapted from materials published by the U.S. Equal Employment Opportunity Commission (EEOC)",
    contentHtml: `
      <p>Workplace harassment based on race, color, national origin, sex, religion, disability, age (40 or older), or genetic information is illegal. You're also protected from being harassed or punished because you &mdash; or someone close to you, like a relative or close friend &mdash; complains about harassment. This is your right to be protected from retaliation.</p>
      <p>Harassment can be verbal, physical, or visual, and it can happen on or off the job site. The harasser could be a manager, a manager in another area, a coworker, or others in your workplace, such as clients or customers. In general, teasing, casual comments, or single instances of inappropriate conduct are not illegal &mdash; for behavior to count as illegal harassment, it must be unwelcome, and it must be severe (very serious) or pervasive (happening frequently). Inappropriate behavior is also illegal if it results in your employer making an employment decision about you, such as refusing to promote you or demoting you.</p>
      <h3>Harassment Doesn't Always Look Obvious</h3>
      <p>Unwelcome sexual attention does not require physical contact or an explicit demand to count as harassment &mdash; repeated comments, unwanted messages, or someone "accidentally" showing up where you are can be enough. And if a supervisor dismisses a complaint or laughs it off, that does not excuse the employer's responsibility to stop the harassment.</p>
      <h3>Real Examples from Student Interns</h3>

        <li><strong>Luisa</strong>, a marketing intern, is offered a ride home by her supervisor, who then asks her out. When she says she'd rather keep things professional, he removes her from her shifts and her project the next day &mdash; this is sexual harassment, and the retaliation that followed is illegal too.</li>
        <li><strong>Marcus</strong>, who stocks shelves at a grocery store, is repeatedly called "the foreigner" by a coworker mocking his accent in front of customers &mdash; this is harassment based on national origin.</li>
        <li><strong>Priya</strong>, a restaurant host, has a manager who comments on her body and corners her in a walk-in freezer. She reports it and is cut from the schedule a week later with no explanation &mdash; both the harassment and the retaliation are illegal.</li>
        <li><strong>Devon</strong>, who has a learning disability, is mocked by a coworker for how he reads order tickets. His supervisor laughs it off as the coworker "just messing around" &mdash; this is disability harassment, and the supervisor's inaction doesn't excuse the employer.</li>
        <li><strong>Amara</strong>, 16, works at a movie theater where an older coworker comments on her age, messages her outside of work, and keeps "accidentally" running into her near her locker &mdash; this is sexual harassment, even though nothing has "happened" yet.</li>

      <p>Take steps early, before harassment becomes severe or pervasive. Tell the harasser you find their behavior unwelcome, if you feel comfortable doing so. If you don't feel comfortable confronting them, or the harassment doesn't stop, tell your employer, your parents, another trusted adult, or the EEOC. Find out if your company has a harassment policy and who is responsible for handling it &mdash; once your employer knows, they're responsible for correcting the situation. If you don't promptly report workplace harassment, it may affect your rights.</p>
    `,

    contentHtml: `
      <h3>What Grooming Is</h3>
      <p>Grooming is the deliberate act of building trust with a child, teen, or at-risk adult for the purpose of exploiting them sexually. It typically starts with friendship, mentorship, or kindness that gradually turns into manipulation and control. Grooming is a process, not a one-time event &mdash; it's perpetrated over weeks, months, or years, and often extends to the victim's family and community so the abuser can build trust with anyone who might interfere. The damage is real and lasting: long-term manipulation, eventual abuse, and the survivor's later realization that someone they trusted exploited them.</p>
      <h3>Who Is At Risk</h3>
      <p>Grooming can happen to anyone, but two groups face the highest risk. <strong>Children</strong> are still developing their understanding of boundaries and trust, are often taught to obey adults without question, and can easily confuse attention with genuine affection. <strong>At-risk adults</strong> &mdash; people who rely on others for care, support, or resources, such as someone with a disability or someone facing financial or housing instability &mdash; can be targeted by someone who controls their resources, support, or safety, including through a caregiver, employer, or partner relationship.</p>
      <h3>What Grooming Looks Like</h3>
      <p>Grooming commonly combines three tactics. <strong>Physical grooming</strong> starts with "accidental" touches that gradually escalate &mdash; tickling, wrestling, hugging &mdash; before becoming sexual. <strong>Psychological grooming</strong> uses gifts, special attention, secret communication, and guilt, and often exploits power differences like age, size, or status. <strong>Community grooming</strong> is how an abuser builds a "good person" reputation with the victim's family, friends, and community to avoid detection and clear the way to commit abuse. Perpetrators can be anyone &mdash; acquaintances, coworkers, coaches, or people in positions of trust and authority, like a supervisor or mentor.</p>
      <h3>Age Gaps and the Law</h3>
      <p>Age alone doesn't make someone a predator, and it doesn't automatically make a relationship abusive. The concern arises when someone uses their age, authority, or life experience to exploit a person's developmental stage for their own gratification. A legal age of consent does not by itself make a relationship safe &mdash; grooming and exploitation often begin long before someone reaches that age, and at-risk adults can be manipulated regardless of their legal status. The real issue is power and exploitation, not just age or legality. Non-abusive relationships are rooted in mutual respect and freely given consent.</p>
      <h3>Red Flags to Watch For</h3>

        <li><strong>Ignoring boundaries:</strong> excessive or unnecessary touching, sexual jokes, or disregard for your privacy.</li>
        <li><strong>Special treatment:</strong> favoritism, unexplained gifts or favors, or compliments about your body or appearance.</li>
        <li><strong>Role creep:</strong> someone inserting themselves into your life in ways that go far beyond what's expected of their actual role.</li>
      </ul>
      <h3>What To Do If You Notice These Signs</h3>
      <p>Trust your intuition &mdash; you don't need to be certain something is wrong to speak up. If it's safe to do so, address the behavior directly and clearly. Keep a record of what happened, with dates, names, and details, and save any evidence like texts or messages. Report your concerns promptly to a trusted adult or your WCSD internship instructor &mdash; you don't need to investigate or confirm anything first; that's the job of the people you report to. Never confront a suspected abuser if you feel unsafe doing so.</p>
    `,

/* =========================================================================
   STATE + PERSISTENCE
   ========================================================================= */
const STORAGE_KEY = "wcsd_wbl_training_v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.mastered) && parsed.mastered.length === SECTIONS.length) {
        return parsed;
      }
    }
  } catch (e) { /* localStorage unavailable, fall back to in-memory only */ }
  return null;
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      studentName: state.studentName,
      studentId: state.studentId,
      mastered: state.mastered
    }));
  } catch (e) { /* ignore */ }
}

const saved = loadProgress();
const state = {
  studentName: saved ? saved.studentName : "",
  studentId: saved ? (saved.studentId || "") : "",
  screen: "landing",
  activeSectionIndex: 0,
  mastered: saved ? saved.mastered : SECTIONS.map(() => false),
  activeQuiz: null,
  answers: null,
  lastScore: null
};

const root = document.getElementById("appRoot");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffledQuiz(sec) {
  return shuffle(sec.questions).map(q => {
    const order = shuffle(q.options.map((_, i) => i));
    const options = order.map(i => q.options[i]);
    const correct = order.indexOf(q.correct);
    return { q: q.q, options, correct };
  });
}

function isUnlocked(i) { return i === 0 || state.mastered[i - 1]; }
function allMastered() { return state.mastered.every(m => m); }

/* =========================================================================
   RENDER: LANDING
   ========================================================================= */
function renderLanding() {
  const topicsHtml = SECTIONS.map((sec, i) => {
    const done = state.mastered[i];
    const unlocked = isUnlocked(i);
    let badge, btn;
    if (done) {
      badge = `<span class="badge done">Mastered</span>`;
      btn = `<button class="btn-secondary" onclick="reviewSection(${i})">Review</button>`;
    } else if (unlocked) {
      badge = `<span class="badge todo">Not started</span>`;
      btn = `<button class="btn-primary" onclick="startSection(${i})">Start</button>`;
    } else {
      badge = `<span class="badge locked">Locked</span>`;
      btn = `<button class="btn-secondary" disabled>Locked</button>`;
    }
    return `
      <div class="topic-item ${unlocked ? "" : "locked"}">
        <div class="t-num">${i + 1}</div>
        <div style="flex:1;">
          <div class="t-name">${esc(sec.name)}</div>
          <div class="t-status">${esc(sec.subtitle)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          ${badge}
          ${btn}
        </div>
      </div>`;
  }).join("");

  const finished = allMastered();

  root.innerHTML = `
    <div class="card">
      <div class="card-body">
        <h2 class="section-title">Welcome</h2>
        <p style="margin:0 0 12px;">This training covers five required safety topics before you begin your Work-Based Learning internship. Complete topics in order &mdash; each one unlocks the next once you score 100% on its quiz. You can complete one topic at a time and come back later; your progress is saved on this device.</p>
        <label for="studentNameInput">Your full name</label>
        <input type="text" id="studentNameInput" placeholder="e.g. Jordan Smith" value="${esc(state.studentName)}">
        <div class="error-msg" id="nameError">Please enter your name before starting a topic.</div>
        <label for="studentIdInput">Your WCSD Student ID number</label>
        <input type="text" id="studentIdInput" placeholder="e.g. 123456" inputmode="numeric" value="${esc(state.studentId)}">
        <div class="error-msg" id="idError">Please enter your student ID number before starting a topic.</div>
      </div>
    </div>

    ${finished ? `
    <div class="card">
      <div class="card-body" style="text-align:center;">
        <h2 class="section-title" style="margin-bottom:6px;">All 5 topics complete</h2>
        <p style="margin:0 0 12px;">Great work. You can now view and print your certificate of completion.</p>
        <button class="btn-gold" onclick="goToCertificate()">View Certificate</button>
      </div>
    </div>` : ""}

    <div class="card">
      <div class="card-body">
        <h2 class="section-title" style="margin-bottom:12px;">Training Topics</h2>
        <div class="topic-list">${topicsHtml}</div>
      </div>
    </div>
    <p class="footer-note">WCSD Work-Based Learning Internship Program &middot; Safety Training Series</p>
  `;

  document.getElementById("studentNameInput").addEventListener("input", (e) => {
    state.studentName = e.target.value;
    saveProgress();
  });
  document.getElementById("studentIdInput").addEventListener("input", (e) => {
    state.studentId = e.target.value;
    saveProgress();
  });
}

function requireName() {
  const nameInput = document.getElementById("studentNameInput");
  const idInput = document.getElementById("studentIdInput");
  const name = nameInput ? nameInput.value.trim() : state.studentName.trim();
  const id = idInput ? idInput.value.trim() : state.studentId.trim();
  let ok = true;
  document.getElementById("nameError").style.display = "none";
  document.getElementById("idError").style.display = "none";
  if (!name) {
    document.getElementById("nameError").style.display = "block";
    ok = false;
  }
  if (!id) {
    document.getElementById("idError").style.display = "block";
    ok = false;
  }
  if (!ok) return false;
  state.studentName = name;
  state.studentId = id;
  saveProgress();
  return true;
}

function startSection(index) {
  if (!requireName()) return;
  state.activeSectionIndex = index;
  state.screen = "content";
  render();
}

function reviewSection(index) {
  if (!requireName()) return;
  state.activeSectionIndex = index;
  state.screen = "review";
  render();
}

/* =========================================================================
   RENDER: CONTENT (reading step, first pass)
   ========================================================================= */
function renderContent() {
  const sec = SECTIONS[state.activeSectionIndex];
  root.innerHTML = `
    <div class="banner">${esc(sec.name)}</div>
    <div class="card" style="border-top:none; border-radius:0 0 8px 8px;">
      <div class="card-body">
        ${stepperHtml("content")}
        <p class="attribution" style="margin-top:12px;">${esc(sec.attribution)}</p>
        <div class="content-body">${sec.contentHtml}</div>
        ${sec.calloutHtml}
        <div class="btn-row">
          <button class="btn-secondary" onclick="backToLanding()">&larr; Back to topics</button>
          <button class="btn-primary" onclick="goToQuiz()">I've read this &mdash; Start the quiz</button>
        </div>
      </div>
    </div>
  `;
}

/* Read-only review for an already-mastered topic (no quiz gate) */
function renderReview() {
  const sec = SECTIONS[state.activeSectionIndex];
  root.innerHTML = `
    <div class="banner">${esc(sec.name)}</div>
    <div class="card" style="border-top:none; border-radius:0 0 8px 8px;">
      <div class="card-body">
        <span class="badge done" style="margin-bottom:10px; display:inline-block;">Mastered</span>
        <p class="attribution">${esc(sec.attribution)}</p>
        <div class="content-body">${sec.contentHtml}</div>
        ${sec.calloutHtml}
        <div class="btn-row">
          <button class="btn-secondary" onclick="backToLanding()">&larr; Back to topics</button>
          <button class="btn-primary" onclick="startSection(${state.activeSectionIndex})">Retake Quiz</button>
        </div>
      </div>
    </div>
  `;
}

function stepperHtml(step) {
  const stepsOrder = ["content", "quiz", "results"];
  const stepIdx = stepsOrder.indexOf(step);
  const labels = ["1. Read", "2. Quiz", "3. Score"];
  return `<div class="stepper">${labels.map((label, i) => {
    let cls = "step";
    if (i < stepIdx) cls += " mastered";
    else if (i === stepIdx) cls += " current";
    else cls += " locked";
    return `<div class="${cls}">${label}</div>`;
  }).join("")}</div>`;
}

function backToLanding() {
  state.screen = "landing";
  render();
}

/* =========================================================================
   RENDER: QUIZ
   ========================================================================= */
function goToQuiz() {
  const sec = SECTIONS[state.activeSectionIndex];
  state.activeQuiz = buildShuffledQuiz(sec);
  state.answers = new Array(state.activeQuiz.length).fill(null);
  state.screen = "quiz";
  render();
}

function renderQuiz() {
  const sec = SECTIONS[state.activeSectionIndex];
  const quiz = state.activeQuiz;
  const answers = state.answers;
  const total = quiz.length;

  const qHtml = quiz.map((q, qi) => {
    const optsHtml = q.options.map((opt, oi) => `
      <label class="opt-label">
        <input type="radio" name="q${qi}" value="${oi}" ${answers[qi] === oi ? "checked" : ""}
          onchange="setAnswer(${qi}, ${oi})">
        <span>${esc(opt)}</span>
      </label>
    `).join("");
    return `
      <div class="quiz-q">
        <div class="q-text">${qi + 1}. ${esc(q.q)}</div>
        ${optsHtml}
      </div>
    `;
  }).join("");

  root.innerHTML = `
    <div class="banner">${esc(sec.name)} &mdash; Quiz</div>
    <div class="card" style="border-top:none; border-radius:0 0 8px 8px;">
      <div class="card-body">
        ${stepperHtml("quiz")}
        <p style="margin:12px 0 0;">You need <strong>100% (${total}/${total})</strong> to master this topic. You can retake the quiz as many times as you need &mdash; questions and answer order are reshuffled each time.</p>
        ${qHtml}
        <div class="error-msg" id="quizError">Please answer every question before submitting.</div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="backToContentFromQuiz()">&larr; Back to reading</button>
          <button class="btn-primary" onclick="submitQuiz()">Submit Quiz</button>
        </div>
      </div>
    </div>
  `;
}

function setAnswer(qIndex, optIndex) {
  state.answers[qIndex] = optIndex;
}

function backToContentFromQuiz() {
  state.screen = "content";
  render();
}

function submitQuiz() {
  const quiz = state.activeQuiz;
  const answers = state.answers;
  if (answers.some(a => a === null)) {
    document.getElementById("quizError").style.display = "block";
    return;
  }
  let correctCount = 0;
  answers.forEach((a, i) => { if (a === quiz[i].correct) correctCount++; });
  state.lastScore = { correct: correctCount, total: quiz.length };
  if (correctCount === quiz.length) {
    state.mastered[state.activeSectionIndex] = true;
    saveProgress();
  }
  state.screen = "results";
  render();
}

/* =========================================================================
   RENDER: RESULTS
   ========================================================================= */
function renderResults() {
  const sec = SECTIONS[state.activeSectionIndex];
  const quiz = state.activeQuiz;
  const answers = state.answers;
  const { correct, total } = state.lastScore;
  const pct = Math.round((correct / total) * 100);
  const passed = correct === total;

  const reviewHtml = quiz.map((q, qi) => {
    const studentAnswer = answers[qi];
    const isCorrect = studentAnswer === q.correct;
    const optsHtml = q.options.map((opt, oi) => {
      let cls = "opt-label";
      if (oi === q.correct) cls += " correct";
      else if (oi === studentAnswer && !isCorrect) cls += " incorrect";
      return `<div class="${cls}">${esc(opt)}${oi === studentAnswer ? " &nbsp;<strong>(your answer)</strong>" : ""}</div>`;
    }).join("");
    return `
      <div class="quiz-q">
        <div class="q-text">${qi + 1}. ${esc(q.q)} ${isCorrect ? "&#9989;" : "&#10060;"}</div>
        ${optsHtml}
      </div>
    `;
  }).join("");

  const isLastSection = state.activeSectionIndex === SECTIONS.length - 1;

  root.innerHTML = `
    <div class="banner">${esc(sec.name)} &mdash; Results</div>
    <div class="card" style="border-top:none; border-radius:0 0 8px 8px;">
      <div class="card-body">
        ${stepperHtml("results")}
        <div class="score-box ${passed ? "pass" : ""}" style="margin-top:14px;">
          <div class="score-num">${correct} / ${total}</div>
          <div class="score-label">${pct}% correct</div>
          <div class="pass-pill ${passed ? "pass" : "review"}">${passed ? "Topic Mastered!" : "100% required &mdash; review and try again"}</div>
        </div>
        <p style="margin:0 0 6px;"><strong>${esc(state.studentName)}</strong>, here's a review of every question with the correct answer marked.</p>
        ${reviewHtml}
        <div class="btn-row">
          ${passed
            ? (isLastSection
                ? `<button class="btn-gold" onclick="goToCertificate()">View Certificate</button>`
                : `<button class="btn-primary" onclick="backToLanding()">Continue to Next Topic &rarr;</button>`)
            : `<button class="btn-primary" onclick="backToContentFromQuiz()">Review Material Again</button>
               <button class="btn-secondary" onclick="goToQuiz()">Try Quiz Again</button>`
          }
          <button class="btn-secondary" onclick="backToLanding()">Back to Topics</button>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================================
   RENDER: CERTIFICATE
   ========================================================================= */
function goToCertificate() {
  state.screen = "certificate";
  render();

        <ul class="cert-topics">${topicsHtml}</ul>
        <div class="callout brown" style="margin-top:18px;">
          <span class="co-label">WCSD REQUIREMENT</span>
          You <strong>MUST</strong> submit a copy of this PDF to your WCSD internship instructor before you begin service at a job site as an intern.
        </div>
      </div>
    </div>
  `;
}

/* =========================================================================
   ROUTER
   ========================================================================= */
function render() {
  if (state.screen === "landing") renderLanding();
  else if (state.screen === "content") renderContent();
  else if (state.screen === "review") renderReview();
  else if (state.screen === "quiz") renderQuiz();
  else if (state.screen === "results") renderResults();
  else if (state.screen === "certificate") renderCertificate();
}

render();
</script>
</body>
</html>
